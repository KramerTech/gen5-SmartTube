# Build settings for the Gen5W SmartTube package. Read by build.sh.

# GitHub "owner/repo" whose releases host this project's builds. SmartTube's
# in-app update check is pointed at
#   https://github.com/$UPDATE_REPO/releases/latest/download/$MANIFEST_ASSET
# Leave empty to turn the update check off (no requests to upstream or anywhere else).
UPDATE_REPO="KramerTech/gen5-SmartTube"

# Fixed release asset names, so "releases/latest/download/<name>" always works.
MANIFEST_ASSET="smarttube-gen5w.json"
APK_ASSET="smarttube-gen5w-armeabi-v7a.apk"

# Oldest media.codecs (gen5w-video-codecs) this package accepts.
CODECS_MIN_VERSION="2.0"

# SHA-256 of the release signing certificate. build.sh refuses to finish if the
# APK was signed with anything else (e.g. a wrong CI secret). Forks with their
# own key put its digest here, from: apksigner verify --print-certs <apk>
SIGNING_CERT_SHA256="ac958b2b6ebeb930cf422625a3f4b27e0c14c893e4dc9db9c8a1ecdeff686782"

# Upstream project the APK comes from.
UPSTREAM_REPO="yuliskov/SmartTube"
