name: release

# Push a tag v<upstream version>-gen5w.<rev>, e.g. v32.68-gen5w.3, to build that
# upstream release with revision <rev>, sign it, and publish a GitHub release.
# An annotated tag's message becomes the release's "Changes" section and the
# in-app changelog.
on:
  push:
    tags: ["v*-gen5w.*"]

permissions:
  contents: read

env:
  APKTOOL_VERSION: "2.12.0"
  APKTOOL_SHA256: effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          tag=${GITHUB_REF_NAME}
          ver=${tag#v}; ver=${ver%-gen5w.*}; rev=${tag##*-gen5w.}
          [[ $ver =~ ^[0-9][0-9.]*$ && $rev =~ ^[0-9]+$ ]] || { echo "::error::tag must look like v32.68-gen5w.3"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          # Annotated tag message, if any (a lightweight tag has none).
          git fetch --no-tags --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$tag" > "$RUNNER_TEMP/notes.txt"
          else
            : > "$RUNNER_TEMP/notes.txt"
          fi

      # mksh is Android's shell, so the hooks run the way the head unit runs them.
      - run: sudo apt-get install -y mksh
      - run: tests/run.sh

      - name: Install apktool
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          echo "$APKTOOL_SHA256  $RUNNER_TEMP/bin/apktool.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/bin/apktool.jar" > "$RUNNER_TEMP/bin/apktool"
          chmod +x "$RUNNER_TEMP/bin/apktool"
          echo "APKTOOL=$RUNNER_TEMP/bin/apktool" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null

      - name: Fetch upstream APK
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Upstream tags stable releases "<ver>s" (and sometimes just "<ver>").
          for t in "${{ steps.tag.outputs.ver }}s" "${{ steps.tag.outputs.ver }}"; do
            if apk=$(tools/fetch-upstream.sh "$t"); then
              echo "apk=$apk" >> "$GITHUB_OUTPUT"
              echo "tag=$t" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no upstream stable release found for ${{ steps.tag.outputs.ver }}"
          exit 1

      - name: Build and sign
        env:
          SMARTTUBE_KEYSTORE_B64: ${{ secrets.SMARTTUBE_KEYSTORE_B64 }}
          SMARTTUBE_KEY_PASS: ${{ secrets.SMARTTUBE_KEY_PASS }}
        run: |
          [ -n "$SMARTTUBE_KEYSTORE_B64" ] && [ -n "$SMARTTUBE_KEY_PASS" ] \
            || { echo "::error::SMARTTUBE_KEYSTORE_B64 and SMARTTUBE_KEY_PASS secrets are required"; exit 1; }
          export SMARTTUBE_KEYSTORE=$RUNNER_TEMP/key/smarttube.jks
          mkdir -m 700 "$RUNNER_TEMP/key"
          trap 'rm -rf "$RUNNER_TEMP/key"' EXIT
          base64 -d <<< "$SMARTTUBE_KEYSTORE_B64" > "$SMARTTUBE_KEYSTORE"
          notes=; [ -s "$RUNNER_TEMP/notes.txt" ] && notes=$RUNNER_TEMP/notes.txt
          ./build.sh "${{ steps.upstream.outputs.apk }}" "${{ steps.tag.outputs.rev }}" $notes
          # build.sh names the zip from the APK's own versionName; it must match the tag.
          zip=smarttube-${{ steps.tag.outputs.ver }}-gen5w.${{ steps.tag.outputs.rev }}.zip
          [ -f "dist/$zip" ] || { echo "::error::expected dist/$zip; tag and upstream version differ"; ls dist; exit 1; }

      - name: Release notes
        run: |
          . ./smarttube.conf
          python3 -I - .github/release-body.md "$RUNNER_TEMP/notes.txt" dist/release-body.md "$CODECS_MIN_VERSION" <<'EOF'
          import sys
          tmpl, notes, out, codecs_min = sys.argv[1:5]
          body = open(tmpl).read()
          changes = open(notes).read().strip()
          subs = {
              "@VERSION@": "${{ steps.tag.outputs.ver }}",
              "@ZIP@": "smarttube-${{ steps.tag.outputs.ver }}-gen5w.${{ steps.tag.outputs.rev }}.zip",
              "@USBZIP@": "smarttube-${{ steps.tag.outputs.ver }}-gen5w.${{ steps.tag.outputs.rev }}-usb.zip",
              "@UPSTREAM_TAG@": "${{ steps.upstream.outputs.tag }}",
              "@CODECS_MIN_VERSION@": codecs_min,
              "@CHANGES@": f"\n**Changes in this build:**\n\n{changes}\n" if changes else "",
          }
          for k, v in subs.items():
              body = body.replace(k, v)
          open(out, "w").write(body)
          EOF
          cat dist/release-body.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishing is a separate job so the job holding the signing key never has
  # write access to the repo.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          ver=${tag#v}; ver=${ver%-gen5w.*}; rev=${tag##*-gen5w.}
          mv dist/release-body.md body.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "SmartTube $ver for Gen5W (build $rev)" --notes-file body.md dist/*
